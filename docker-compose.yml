services:
  backend:
    build: ./backend
    expose:
      - "8000"
    env_file: .env
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  nginx:
    build: ./nginx
    ports:
      - "8086:80"
    depends_on:
      - backend
      - frontend
