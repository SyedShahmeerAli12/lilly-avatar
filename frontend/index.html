<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwa Investment Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-mark">J</div>
      <div>
        <span class="logo-name">Jadwa Investment</span>
        <span class="logo-sub">Account Opening Assistant</span>
      </div>
    </div>
    <div id="status-badge" class="badge badge-idle">Ready</div>
  </header>

  <!-- Main -->
  <main>
    <!-- Avatar panel -->
    <section class="avatar-panel">
      <div class="avatar-wrap">
        <video id="avatar-video" autoplay playsinline></video>
        <audio id="avatar-audio" autoplay></audio>

        <!-- Idle overlay -->
        <div id="idle-overlay" class="idle-overlay">
          <div class="avatar-placeholder">S</div>
          <p id="overlay-text">Click Start to begin</p>
        </div>
      </div>

      <div class="avatar-info">
        <span id="speaking-dot" class="dot dot-idle"></span>
        <div>
          <p class="avatar-name">Sara</p>
          <p class="avatar-role">Jadwa Account Assistant</p>
        </div>
      </div>
    </section>

    <!-- Right panel -->
    <section class="right-panel">

      <!-- Transcript -->
      <div class="transcript-box" id="transcript-box">
        <div class="transcript-empty" id="transcript-empty">
          Conversation will appear here...
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="start-btn" class="btn btn-primary" onclick="startSession()">
          Start Consultation
        </button>
        <button id="done-btn" class="btn btn-danger" onclick="endSession()" style="display:none">
          Done
        </button>
      </div>

    </section>
  </main>

  <!-- Summary modal -->
  <div id="summary-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <p class="modal-label">Session Complete</p>
        <h2 class="modal-title">Conversation Summary</h2>
      </div>
      <div id="summary-content" class="summary-content">
        Generating summary...
      </div>
      <button class="btn btn-primary" onclick="restartSession()">
        Start New Session
      </button>
    </div>
  </div>

  <script src="simli-bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
